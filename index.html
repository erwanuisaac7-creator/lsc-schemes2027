        let selectedClass = null;
        let selectedTerm = null;
        let selectedChapter = null;
        let selectedSubtopic = null;

        const appContainer = document.getElementById('app-container');

        function renderApp() {
            appContainer.innerHTML = '';
            if (currentView === 'subjects') renderSubjectsView();
            else if (currentView === 'classes') renderClassesView();
            else if (currentView === 'terms') renderTermsView();
            else if (currentView === 'chapters') renderChaptersView();
            else if (currentView === 'subtopics') renderSubtopicsView();
            else if (currentView === 'document') renderDocumentView();
        }

        function renderSubjectsView() {
            let html = `
                <div class="mb-6">
                    <h2 class="text-2xl font-bold mb-1">Select Subject</h2>
                    <p class="text-slate-400 text-sm">Choose from all 8 official NCDC lower secondary curriculum subjects.</p>
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-4">
            `;
            for (let subj in curriculumData) {
                html += `
                    <div onclick="selectSubject('${subj}')" class="bg-slate-900 border border-slate-800 rounded-xl p-5 cursor-pointer hover:border-emerald-500 transition flex flex-col justify-between">
                        <div>
                            <div class="text-3xl mb-3">${curriculumData[subj].icon}</div>
                            <h3 class="font-bold text-lg">${subj}</h3>
                            <p class="text-xs text-slate-400 mt-1">S1 - S4 Syllabus</p>
                        </div>
                        <span class="mt-6 text-emerald-400 text-xs font-semibold">Explore Syllabus &rarr;</span>
                    </div>
                `;
            }
            html += `</div>`;
            appContainer.innerHTML = html;
        }

        function selectSubject(subj) {
            selectedSubject = subj;
            currentView = 'classes';
            renderApp();
        }

        function renderClassesView() {
            let classesList = Object.keys(curriculumData[selectedSubject].classes);
            appContainer.innerHTML = `
                <button onclick="currentView='subjects'; renderApp();" class="text-emerald-400 text-sm font-medium mb-4 flex items-center">&larr; Back to Subjects</button>
                <div class="mb-6">
                    <h2 class="text-2xl font-bold mb-1">${selectedSubject} &bull; Select Class</h2>
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-4">
                    ${classesList.map(cls => `
                        <div onclick="selectClass('${cls}')" class="bg-slate-900 border border-slate-800 rounded-xl p-5 cursor-pointer hover:border-emerald-500 transition">
                            <h3 class="font-bold text-lg text-emerald-400">${cls}</h3>
                            <p class="text-xs text-slate-400 mt-1">NCDC Standard</p>
                        </div>
                    `).join('')}
                </div>
            `;
        }

        function selectClass(cls) {
            selectedClass = cls;
            currentView = 'terms';
            renderApp();
        }

        function renderTermsView() {
            let termsList = Object.keys(curriculumData[selectedSubject].classes[selectedClass].terms);

                <button onclick="currentView='classes'; renderApp();" class="text-emerald-400 text-sm font-medium mb-4 flex items-center">&larr; Back to Classes</button>
                <div class="mb-6">
                    <h2 class="text-2xl font-bold mb-1">${selectedSubject} (${selectedClass}) &bull; Select Term</h2>
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                    ${termsList.map(term => `
                        <div onclick="selectTerm('${term}')" class="bg-slate-900 border border-slate-800 rounded-xl p-5 cursor-pointer hover:border-emerald-500 transition">

            currentView = 'chapters';
            renderApp();

        function renderChaptersView() {
            let chaptersList = Object.keys(curriculumData[selectedSubject].classes[selectedClass].terms[selectedTerm].chapters);

                    <p class="text-slate-400 text-sm">Select Chapter / Core Topic</p>

                <div class="space-y-3">
                    ${chaptersList.map(chap => `
                        <div onclick="selectChapter('${chap}')" class="bg-slate-900 border border-slate-800 rounded-xl p-4 cursor-pointer hover:border-emerald-500 transition flex justify-between items-center">

                    <p class="text-slate-400 text-sm">Select a Sub-Topic to view the NCDC tabulated scheme and lesson plan.</p>
                </div>

                    `).join('')}
                </div>
            `;
        }

            selectedSubtopic = sub;
            currentView = 'document';
            renderApp();

            appContainer.innerHTML = `

                                    <th class="p-3">K-U-S-V Focus</th>
                                    <th class="p-3">Suggested Activities</th>
                                    <th class="p-3">Resources</th>
                                    <th class="p-3">Assessment</th>
                                </tr>
                            </thead>

                                    <td class="p-3">Observation, quizzes, and structured classroom questioning.</td>
                                </tr>

            `;

        function triggerDownload(format) {
            alert(`Preparing your neat ${format} document for "${selectedSubtopic}" (${selectedSubject}). Your free download is starting!`);
            if (format === 'PDF') {
                window.print();
            }
        }

        renderApp();
    </script>
